# The name of this file is used in the helm charts repo for octo-sts.
# Please keep that in mind if you want to rename this file.
name: Release version

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      changelog: ${{ steps.release.outputs.body }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  goreleaser:
    runs-on: runs-on=${{ github.run_id }}/runner=sw-amd64/cpu=4
    needs: release-please
    if: ${{ needs.release-please.outputs.release-created == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.12.5@sha256:449188623c7a8a3bd4f161c5d0ddf5cabbfb828f7eaadf9ed8111864b911a308
            network=host

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run goreleaser on release branch
        id: goreleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release with kube generated files
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.release-please.outputs.version }}
          overwrite: true
          file_glob: true
          file: release/*

  release-helm-chart:
    runs-on: runs-on=${{ github.run_id }}/runner=sw-amd64/cpu=1
    needs: [release-please, goreleaser]
    if: ${{ needs.release-please.outputs.release-created == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - uses: octo-sts/action@6177b4481c00308b3839969c3eca88c96a91775f # v1.0.0
        id: octo-sts
        with:
          scope: shopware/helm-charts
          identity: shopware-operator

      - name: make pr on helm-charts for this release
        run: |
          make manifests
          tag=${{ needs.release-please.outputs.version }}
          branch=auto-release-shopware-${tag}
          git clone https://oauth2:${GITHUB_TOKEN}@github.com/shopware/helm-charts.git
          rm -rf helm-charts/charts/shopware-operator
          make helm version=${tag} path=helm-charts/charts/shopware-operator
          cd helm-charts
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git checkout -b "${branch}"
          git add .
          git commit -m "New shopware operator image"
          git push origin "${branch}"
          gh pr create \
            --title "Autorelease from shopware operator" \
            --body "Auto PR from shopware operator" \
            --head ${branch} \
            --base main \
            --reviewer shopware/product-paas \
            --label autorelease
          gh pr merge --merge --auto --delete-branch "${branch}"
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
