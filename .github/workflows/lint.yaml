name: Lint

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  golangci:
    name: golangci
    runs-on: runs-on=${{ github.run_id }}/runner=sw-amd64/cpu=1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run linter
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.10
          args: --timeout=8m --verbose

  go-test:
    name: go test
    runs-on: runs-on=${{ github.run_id }}/runner=sw-amd64/cpu=1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run go tests
        run: |
          make manifests
          go test ./...

  helm-lint:
    name: helm lint
    runs-on: runs-on=${{ github.run_id }}/runner=sw-amd64/cpu=1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.16.4
      - name: helm lint
        run: |
          make helm path=test version=99.99.98
          cd test
          helm lint .
          helm template no-webhook . --set crds.install=false --set webhook.enabled=false > /tmp/no-webhook.yaml
          if grep -Eq 'kind: (Certificate|Issuer|ValidatingWebhookConfiguration)|cert-manager.io|webhook-certs|containerPort: 9443' /tmp/no-webhook.yaml; then
            echo "Webhook resources were rendered while webhook.enabled=false"
            exit 1
          fi
          grep -A1 'name: ENABLE_WEBHOOK' /tmp/no-webhook.yaml | grep -q 'value: "false"'

  test-on-cluster:
    name: Cluster E2E Test
    runs-on: runs-on=${{ github.run_id }}/runner=sw-amd64/cpu=4
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Needed for controler runtime and goreleaser
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.12.5
            network=host

      - name: Configure goreleaser for amd64 linux only
        uses: mikefarah/yq@8f3291d3165497b360b8ffee3c887624bb6fa1cf # master
        with:
          cmd: |
            yq -i '.builds[].goos = ["linux"] | .builds[].goarch = ["amd64"] | .dockers_v2[].platforms = ["linux/amd64"]' .goreleaser.yaml

      - name: Create Snapshot
        id: goreleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Helm charts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/helm
            ~/.local/share/helm
          key: ${{ runner.os }}-helm-${{ hashFiles('**/Chart.yaml', '**/Chart.lock') }}
          restore-keys: |
            ${{ runner.os }}-helm-

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.16.4

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1
        with:
          registry: true
          registry_name: kind-registry
          registry_port: 5001
          registry_enable_delete: true

      - name: Install cert-manager
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.21.0/cert-manager.yaml
          kubectl wait --namespace cert-manager --for=condition=Available --timeout=2m deployment/cert-manager deployment/cert-manager-cainjector deployment/cert-manager-webhook

      - name: Run chart-testing (install)
        run: |
          version="${{ fromJSON(steps.goreleaser.outputs.metadata).version }}-amd64"
          echo Using version $version for image version
          kind load docker-image --name chart-testing ghcr.io/shopware/shopware-operator:$version

          make helm path=test version=99.99.98
          helm lint test
          kubectl create namespace test

          helm template test --namespace test test --set image.tag="$version" > rendered.yaml
          kubectl apply --server-side -f rendered.yaml --namespace test
          kubectl wait --namespace test --for=condition=Ready --timeout=60s certificate/test-serving-cert
          kubectl wait --namespace test --for=condition=Available --timeout=60s deployment/test-shopware-operator

          for _ in {1..30}; do
            ca_bundle="$(kubectl get validatingwebhookconfiguration test-test-shopware-operator-validating-webhook -o jsonpath='{.webhooks[0].clientConfig.caBundle}')"
            if [ -n "$ca_bundle" ]; then
              break
            fi
            sleep 2
          done
          test -n "$ca_bundle"

          webhook_validated=false
          for _ in {1..30}; do
            if kubectl apply --namespace test -f .github/testdata/invalid_store_override.yaml >/tmp/invalid-store.log 2>&1; then
              echo "Store with an unknown container override field was accepted"
              kubectl delete --namespace test -f .github/testdata/invalid_store_override.yaml --ignore-not-found=true
              exit 1
            fi
            if grep -q "unknown field" /tmp/invalid-store.log; then
              webhook_validated=true
              break
            fi
            sleep 2
          done
          if [ "$webhook_validated" != "true" ]; then
            echo "Webhook did not return the expected validation response"
            cat /tmp/invalid-store.log
            exit 1
          fi

          kubectl get deployment --namespace test -o wide
          kubectl rollout status --namespace test deployment/test-shopware-operator --timeout=60s

          kubectl get pods --namespace test -o wide
          kubectl get pods --namespace test -o=custom-columns='IMAGE:spec.containers[0].image'

          # Test StoreExec resources
          kubectl apply -f examples/command.yaml --namespace test
          kubectl apply -f examples/cron.yaml --namespace test

          echo "Testing StoreExec resources..."
          kubectl wait --namespace test --for=jsonpath="{.status.state}"=wait --timeout=2m storeexec/test-cron || {
            kubectl get --namespace test job/test -o json && exit 1
          }
          kubectl wait --namespace test --for=jsonpath="{.status.state}"=wait --timeout=2m storeexec/test || {
            kubectl get --namespace test cronjob/test-cron -o json && exit 2
          }

          # Test StoreDebugInstances
          kubectl apply -f examples/storedebuginstance.yaml --namespace test
          kubectl wait --namespace test --for=jsonpath="{.status.state}"=wait --timeout=2m storedebuginstance/debug || {
            kubectl get --namespace test storedebuginstance/debug -o json && exit 1
          }

          # Test StoreSnapshotCreate resource
          echo "Testing StoreSnapshotCreate resource..."
          kubectl apply -f examples/snapshot_create.yaml --namespace test
          kubectl wait --namespace test --for=condition=Ready --timeout=30s storesnapshotcreate/snap-create || {
            echo "StoreSnapshotCreate not ready, checking status..."
            kubectl get storesnapshotcreate/snap-create --namespace test -o yaml
          }

          # Test StoreSnapshotRestore resource
          echo "Testing StoreSnapshotRestore resource..."
          kubectl apply -f examples/snapshot_restore.yaml --namespace test
          kubectl wait --namespace test --for=condition=Ready --timeout=30s storesnapshotrestore/snap-create || {
            echo "StoreSnapshotRestore not ready, checking status..."
            kubectl get storesnapshotrestore/snap-create --namespace test -o yaml
          }

          # Validate all resources are properly created
          echo "Validating all resources..."
          kubectl get storeexec --namespace test
          kubectl get storesnapshotcreate --namespace test
          kubectl get storesnapshotrestore --namespace test

          # Check logs for any errors
          echo "Checking operator logs for permission errors and unhandled errors..."
          kubectl logs --namespace test deployment/test-shopware-operator --tail=100 > operator-logs.txt
          cat operator-logs.txt

          # Check for permission errors (forbidden) and Unhandled Errors
          if grep -i "forbidden" operator-logs.txt; then
            echo "ERROR: Found permission errors (forbidden) in operator logs"
            exit 1
          fi

          if grep -i "Unhandled Error" operator-logs.txt; then
            echo "ERROR: Found unhandled errors in operator logs"
            exit 1
          fi

          if grep -F '"level":"error"' operator-logs.txt; then
            echo "ERROR: Found error-level entries in operator logs"
            exit 1
          fi

          echo "No permission, unhandled, or error-level entries found in operator logs"

          # Cleanup test resources
          echo "Cleaning up test resources..."
          kubectl delete -f examples/snapshot_restore.yaml --namespace test --ignore-not-found=true
          kubectl delete -f examples/snapshot_create.yaml --namespace test --ignore-not-found=true
          kubectl delete -f examples/cron.yaml --namespace test --ignore-not-found=true
          kubectl delete -f examples/command.yaml --namespace test --ignore-not-found=true

          echo "E2E test completed successfully!"
